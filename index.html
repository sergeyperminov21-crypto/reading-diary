<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Личный дневник чтения: книги, оценки, цитаты, впечатления.">
<title>Дневник чтения</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<style>
  :root{
    --bg:#f4efe6; --paper:#fffdf8; --ink:#2c231a; --muted:#8a7c68;
    --accent:#9c5b34; --accent-dark:#7a4426; --gold:#d4a72c; --line:#e5dbc9;
    --shadow:0 1px 2px rgba(60,40,20,.05), 0 10px 28px rgba(60,40,20,.07);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
    background:var(--bg);
    background-image:radial-gradient(circle at 15% -10%,#fdf9f0 0%,transparent 55%),
                     radial-gradient(circle at 90% 0%,#f7f0e2 0%,transparent 45%);
    color:var(--ink); line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  header{padding:52px 20px 26px;text-align:center}
  header .ornament{font-size:18px;color:var(--gold);letter-spacing:.4em;margin-bottom:10px}
  h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:clamp(28px,5.5vw,46px);margin:0 0 10px;letter-spacing:-.5px}
  header p{margin:0;color:var(--muted);font-size:15px}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px 90px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:34px 0 26px}
  .stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:15px 18px;box-shadow:var(--shadow)}
  .stat b{display:block;font-family:Georgia,serif;font-weight:400;font-size:27px;line-height:1.2}
  .stat span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:24px}
  .search{flex:1 1 240px;position:relative}
  .search input{width:100%;padding:12px 16px 12px 40px;border-radius:12px;border:1px solid var(--line);
    background:var(--paper);font-size:15px;color:inherit;font-family:inherit;outline:none;transition:border-color .18s, box-shadow .18s}
  .search input:focus{border-color:#cbb894;box-shadow:0 0 0 3px rgba(212,167,44,.14)}
  .search::before{content:'⌕';position:absolute;left:15px;top:50%;transform:translateY(-52%);font-size:19px;color:var(--muted);pointer-events:none}
  .chips{display:flex;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px}
  .chip{border:none;background:none;font-family:inherit;font-size:13.5px;padding:7px 13px;border-radius:9px;cursor:pointer;color:var(--muted);transition:.16s;white-space:nowrap}
  .chip:hover{color:var(--ink)}
  .chip.active{background:var(--ink);color:#fff8ec}
  select{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-family:inherit;font-size:14px;color:inherit;cursor:pointer;outline:none}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:12px;border:1px solid var(--line);
    background:var(--paper);color:var(--ink);font-family:inherit;font-size:14.5px;cursor:pointer;transition:.18s}
  .btn:hover{border-color:#cbb894;background:#fffefb}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff8f0;box-shadow:0 6px 18px rgba(156,91,52,.25)}
  .btn-primary:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:18px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px 18px 14px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;transition:transform .18s ease, box-shadow .18s ease;animation:rise .32s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card:hover{transform:translateY(-3px);box-shadow:0 3px 10px rgba(60,40,20,.08), 0 18px 40px rgba(60,40,20,.09)}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
  .badge{font-size:11px;text-transform:uppercase;letter-spacing:.07em;padding:4px 10px;border-radius:20px;font-weight:600;white-space:nowrap}
  .badge.want{background:#ede9f5;color:#6b4e9c}
  .badge.reading{background:#fdf1de;color:#9a6b12}
  .badge.read{background:#e8f3e9;color:#2f7a44}
  .card-actions{display:flex;gap:2px}
  .icon-btn{border:none;background:none;cursor:pointer;font-size:15px;color:#c3b6a1;padding:3px 6px;border-radius:8px;line-height:1;transition:.16s}
  .icon-btn:hover{background:#f3ece0;color:var(--accent)}
  .card h3{font-family:Georgia,serif;font-weight:400;font-size:20px;margin:0 0 3px;line-height:1.3;letter-spacing:-.2px}
  .card .author{color:var(--muted);font-size:13.5px;margin:0 0 8px;font-style:italic}
  .stars{color:var(--gold);font-size:15px;letter-spacing:1.5px;margin-bottom:8px}
  .stars .off{color:#e2d8c5}
  .review{font-size:14px;color:#4b4034;margin:0 0 10px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
  blockquote{margin:0 0 10px;padding:2px 0 2px 13px;border-left:2px solid var(--gold);font-family:Georgia,serif;font-style:italic;
    font-size:13.5px;color:#6b5d4b;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .card footer{margin-top:auto;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
  .empty{text-align:center;padding:70px 20px;color:var(--muted);border:2px dashed var(--line);border-radius:20px}
  .empty .big{font-size:44px;margin-bottom:10px;opacity:.5}
  .empty p{margin:0 0 4px;font-size:16px;color:#6b5d4b}
  dialog{border:none;padding:0;border-radius:20px;width:min(580px,94vw);max-height:92vh;background:var(--paper);color:var(--ink);box-shadow:0 30px 80px rgba(40,28,14,.35)}
  dialog::backdrop{background:rgba(45,33,20,.45);backdrop-filter:blur(3px)}
  dialog form{padding:26px 28px 24px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;max-height:92vh}
  dialog h2{font-family:Georgia,serif;font-weight:400;font-size:24px;margin:0 0 2px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
  .field input,.field textarea,.field select{width:100%;padding:10px 13px;border-radius:10px;border:1px solid var(--line);
    background:#fffefb;font-family:inherit;font-size:14.5px;color:inherit;outline:none;transition:border-color .16s, box-shadow .16s}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:#cbb894;box-shadow:0 0 0 3px rgba(212,167,44,.14)}
  .field textarea{resize:vertical;min-height:78px;line-height:1.5}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .rating-input{display:flex;gap:2px}
  .rating-input button{background:none;border:none;cursor:pointer;font-size:29px;line-height:1;color:#e2d8c5;padding:0 2px;transition:color .12s, transform .12s}
  .rating-input button.active{color:var(--gold)}
  .rating-input button:hover{transform:scale(1.12)}
  dialog .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
  @media(max-width:640px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .row{grid-template-columns:1fr}
    header{padding-top:34px}
  }
</style>
</head>
<body>

<header>
  <div class="ornament">✦ ❦ ✦</div>
  <h1>Дневник чтения</h1>
  <p>Каждая книга — это прожитая жизнь. Не потеряй ни одной.</p>
</header>

<div class="wrap">
  <section class="stats" aria-label="Статистика">
    <div class="stat"><b id="statTotal">0</b><span>Всего книг</span></div>
    <div class="stat"><b id="statRead">0</b><span>Прочитано</span></div>
    <div class="stat"><b id="statPages">0</b><span>Страниц</span></div>
    <div class="stat"><b id="statRating">—</b><span>Средняя оценка</span></div>
  </section>

  <div class="toolbar">
    <div class="search">
      <input type="search" id="searchInput" placeholder="Поиск по названию, автору, отзыву…" aria-label="Поиск">
    </div>
    <div class="chips" id="chips" role="tablist">
      <button class="chip active" data-status="all" role="tab">Все</button>
      <button class="chip" data-status="want" role="tab">Хочу</button>
      <button class="chip" data-status="reading" role="tab">Читаю</button>
      <button class="chip" data-status="read" role="tab">Прочитано</button>
    </div>
    <select id="sortSelect" aria-label="Сортировка">
      <option value="recent">Сначала новые</option>
      <option value="title">По названию</option>
      <option value="author">По автору</option>
      <option value="rating">По оценке</option>
      <option value="pages">По объёму</option>
    </select>
    <button class="btn btn-primary" id="addBtn">＋ Добавить книгу</button>
    <button class="btn" id="exportBtn" title="Скачать резервную копию">⤓</button>
    <label class="btn" title="Загрузить из файла" style="cursor:pointer">
      ⤒<input type="file" id="importInput" accept="application/json" hidden>
    </label>
  </div>

  <div class="grid" id="grid"></div>
</div>

<dialog id="bookDialog">
  <form id="bookForm">
    <h2 id="dialogTitle">Новая книга</h2>
    <div class="field">
      <label for="f-title">Название *</label>
      <input id="f-title" required maxlength="200" placeholder="Например, «Мастер и Маргарита»">
    </div>
    <div class="row">
      <div class="field">
        <label for="f-author">Автор</label>
        <input id="f-author" maxlength="120" placeholder="Михаил Булгаков">
      </div>
      <div class="field">
        <label for="f-genre">Жанр</label>
        <input id="f-genre" maxlength="60" placeholder="Роман">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="f-pages">Страниц</label>
        <input id="f-pages" type="number" min="0" max="99999" placeholder="480">
      </div>
      <div class="field">
        <label for="f-status">Статус</label>
        <select id="f-status">
          <option value="want">Хочу прочитать</option>
          <option value="reading">Читаю</option>
          <option value="read">Прочитано</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Оценка</label>
        <div class="rating-input" id="ratingInput">
          <button type="button" data-star="1">★</button>
          <button type="button" data-star="2">★</button>
          <button type="button" data-star="3">★</button>
          <button type="button" data-star="4">★</button>
          <button type="button" data-star="5">★</button>
        </div>
      </div>
      <div class="field">
        <label for="f-date">Дата завершения</label>
        <input id="f-date" type="date">
      </div>
    </div>
    <div class="field">
      <label for="f-review">Впечатления</label>
      <textarea id="f-review" maxlength="4000" placeholder="О чём книга, что зацепило, кому порекомендуешь…"></textarea>
    </div>
    <div class="field">
      <label for="f-quote">Цитата</label>
      <textarea id="f-quote" maxlength="1000" placeholder="Фраза, которую хочется сохранить" style="min-height:62px"></textarea>
    </div>
    <div class="actions">
      <button type="button" class="btn" id="cancelBtn">Отмена</button>
      <button type="submit" class="btn btn-primary">Сохранить</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  'use strict';
  const STORAGE_KEY = 'reading-diary-v1';
  const $  = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const STATUS = {
    want:    { label: 'Хочу прочитать' },
    reading: { label: 'Читаю' },
    read:    { label: 'Прочитано' }
  };
  let books = [];
  try {
    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (Array.isArray(raw)) books = raw;
  } catch (e) { books = []; }
  const filters = { search: '', status: 'all', sort: 'recent' };
  let editingId = null;
  let formRating = 0;

  const save = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(books));
  const uid  = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const esc  = (s = '') => String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const fmtDate = iso => {
    if (!iso) return '';
    const d = new Date(iso + 'T00:00:00');
    return isNaN(d) ? '' : d.toLocaleDateString('ru-RU', { day:'numeric', month:'short', year:'numeric' });
  };
  const plural = (n, forms) => {
    const a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return forms[2];
    if (b > 1 && b < 5)   return forms[1];
    if (b === 1)          return forms[0];
    return forms[2];
  };

  function visibleBooks() {
    const q = filters.search.trim().toLowerCase();
    const list = books.filter(b => {
      const matchQ = !q || [b.title, b.author, b.genre, b.review, b.quote]
        .some(v => (v || '').toLowerCase().includes(q));
      const matchS = filters.status === 'all' || b.status === filters.status;
      return matchQ && matchS;
    });
    const sorters = {
      recent: (a, b) => (b.createdAt || 0) - (a.createdAt || 0),
      title:  (a, b) => (a.title  || '').localeCompare(b.title  || '', 'ru'),
      author: (a, b) => (a.author || '').localeCompare(b.author || '', 'ru'),
      rating: (a, b) => (b.rating || 0) - (a.rating || 0),
      pages:  (a, b) => (b.pages  || 0) - (a.pages  || 0)
    };
    return list.sort(sorters[filters.sort] || sorters.recent);
  }

  function starsHTML(r) {
    let out = '';
    for (let i = 1; i <= 5; i++) out += `<span class="${i <= r ? '' : 'off'}">★</span>`;
    return out;
  }

  function cardHTML(b) {
    const st = STATUS[b.status] || STATUS.want;
    const meta = [];
    if (b.genre) meta.push(esc(b.genre));
    if (b.pages) meta.push(b.pages + ' ' + plural(b.pages, ['стр.', 'стр.', 'стр.']));
    if (b.date)  meta.push('✓ ' + fmtDate(b.date));
    return `
      <article class="card" data-id="${b.id}">
        <div class="card-top">
          <span class="badge ${esc(b.status)}">${st.label}</span>
          <div class="card-actions">
            <button class="icon-btn" data-action="edit" title="Редактировать">✎</button>
            <button class="icon-btn" data-action="delete" title="Удалить">✕</button>
          </div>
        </div>
        <h3>${esc(b.title)}</h3>
        ${b.author ? `<p class="author">${esc(b.author)}</p>` : ''}
        ${b.rating ? `<div class="stars">${starsHTML(b.rating)}</div>` : ''}
        ${b.review ? `<p class="review">${esc(b.review)}</p>` : ''}
        ${b.quote ? `<blockquote>«${esc(b.quote)}»</blockquote>` : ''}
        ${meta.length ? `<footer>${meta.map(m => `<span>${m}</span>`).join('')}</footer>` : ''}
      </article>`;
  }

  function render() {
    const grid = $('#grid');
    const list = visibleBooks();
    grid.innerHTML = list.length
      ? list.map(cardHTML).join('')
      : `<div class="empty" style="grid-column:1/-1">
           <div class="big">📖</div>
           <p>${books.length ? 'Ничего не найдено' : 'Дневник пока пуст'}</p>
           <p style="font-size:14px">${books.length ? 'Попробуй изменить фильтры или запрос' : 'Нажми «Добавить книгу», чтобы начать'}</p>
         </div>`;
    updateStats();
  }

  function updateStats() {
    const read  = books.filter(b => b.status === 'read');
    const pages = read.reduce((a, b) => a + (Number(b.pages) || 0), 0);
    const rated = books.filter(b => b.rating > 0);
    const avg = rated.length
      ? (rated.reduce((a, b) => a + b.rating, 0) / rated.length).toFixed(1)
      : '—';
    $('#statTotal').textContent  = books.length;
    $('#statRead').textContent   = read.length;
    $('#statPages').textContent  = pages.toLocaleString('ru-RU');
    $('#statRating').textContent = avg;
  }

  function paintStars(v) {
    $$('#ratingInput button').forEach(btn => {
      btn.classList.toggle('active', Number(btn.dataset.star) <= v);
    });
  }
  $('#ratingInput').addEventListener('click', e => {
    const btn = e.target.closest('button[data-star]');
    if (!btn) return;
    const v = Number(btn.dataset.star);
    formRating = (formRating === v) ? 0 : v;
    paintStars(formRating);
  });
  $('#ratingInput').addEventListener('mouseover', e => {
    const btn = e.target.closest('button[data-star]');
    if (btn) paintStars(Number(btn.dataset.star));
  });
  $('#ratingInput').addEventListener('mouseleave', () => paintStars(formRating));

  const dialog = $('#bookDialog');

  function openDialog(book = null) {
    editingId = book ? book.id : null;
    $('#dialogTitle').textContent = book ? 'Редактировать запись' : 'Новая книга';
    $('#f-title').value  = book?.title  || '';
    $('#f-author').value = book?.author || '';
    $('#f-genre').value  = book?.genre  || '';
    $('#f-pages').value  = book?.pages  || '';
    $('#f-status').value = book?.status || 'read';
    $('#f-date').value   = book?.date   || '';
    $('#f-review').value = book?.review || '';
    $('#f-quote').value  = book?.quote  || '';
    formRating = book?.rating || 0;
    paintStars(formRating);
    dialog.showModal();
    setTimeout(() => $('#f-title').focus(), 60);
  }

  $('#addBtn').addEventListener('click', () => openDialog());
  $('#cancelBtn').addEventListener('click', () => dialog.close());

  $('#bookForm').addEventListener('submit', e => {
    e.preventDefault();
    const title = $('#f-title').value.trim();
    if (!title) return;
    const data = {
      title,
      author: $('#f-author').value.trim(),
      genre:  $('#f-genre').value.trim(),
      pages:  Number($('#f-pages').value) || 0,
      status: $('#f-status').value,
      rating: formRating,
      date:   $('#f-date').value,
      review: $('#f-review').value.trim(),
      quote:  $('#f-quote').value.trim()
    };
    if (editingId) {
      const i = books.findIndex(b => b.id === editingId);
      if (i > -1) books[i] = { ...books[i], ...data };
    } else {
      books.push({ id: uid(), createdAt: Date.now(), ...data });
      filters.status = 'all';
      $$('#chips .chip').forEach(c => c.classList.toggle('active', c.dataset.status === 'all'));
    }
    save();
    render();
    dialog.close();
  });

  $('#grid').addEventListener('click', e => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const id = btn.closest('.card').dataset.id;
    const book = books.find(b => b.id === id);
    if (!book) return;
    if (btn.dataset.action === 'edit') openDialog(book);
    if (btn.dataset.action === 'delete' &&
        confirm(`Удалить запись о книге «${book.title}»?`)) {
      books = books.filter(b => b.id !== id);
      save();
      render();
    }
  });

  $('#searchInput').addEventListener('input', e => {
    filters.search = e.target.value;
    render();
  });
  $('#chips').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    filters.status = chip.dataset.status;
    $$('#chips .chip').forEach(c => c.classList.toggle('active', c === chip));
    render();
  });
  $('#sortSelect').addEventListener('change', e => {
    filters.sort = e.target.value;
    render();
  });

  $('#exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(books, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `reading-diary-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  });

  $('#importInput').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data)) throw new Error('bad format');
        if (!confirm(`Импортировать ${data.length} ${plural(data.length, ['запись','записи','записей'])}? Текущие данные будут заменены.`)) return;
        books = data.map(b => ({ ...b, id: b.id || uid(), createdAt: b.createdAt || Date.now() }));
        save();
        render();
      } catch (err) {
        alert('Не удалось прочитать файл. Нужен JSON, сохранённый этим дневником.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  render();
})();
</script>
</body>
</html>
